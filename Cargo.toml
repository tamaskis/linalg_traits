[package]
name = "linalg-traits"
version = "0.20.0"
authors = ["Tamas Kis"]
edition = "2024"
rust-version = "1.86"
description = "Traits for generic linear algebra."
documentation = "https://docs.rs/linalg-traits"
repository = "https://github.com/tamaskis/linalg_traits"
license = "MIT OR Apache-2.0"
keywords = ["linear-algebra", "traits", "matrix", "vector", "math"]
categories = ["mathematics", "science"]

exclude = [".github/", ".vscode/", "book/", "example/", ".gitignore", "Cargo.lock"]

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "src/docs-header.html" ]
features = ["faer", "nalgebra", "ndarray"]

[features]
faer = ["dep:faer", "dep:faer-traits"]
nalgebra = ["dep:nalgebra", "dep:approx", "dep:simba"]
ndarray = ["dep:ndarray"]

[dependencies]
approx = { version = "0.5.1", optional = true }
faer = { version = "0.24.4", optional = true }
faer-traits = { version = "0.24.0", optional = true }
imply-hack = "0.1.0"
nalgebra = { version = "0.35.0", optional = true }
simba = { version = "0.10.2", optional = true }
ndarray = { version = "0.17.2", optional = true }
num-traits = "0.2.19"
rand = "0.10.2" # not directly used, but fixes security vulnerability
rustversion = "1.0.23"

[dev-dependencies]
linalg-traits-example = { path = "example" }
numtest = "0.5.0"

[workspace]
members = ["example"]
